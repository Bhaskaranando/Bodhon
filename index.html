<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বোধন - প্রথাগত বাংলা সাহিত্য আসর</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #fcfbf7; /* হালকা ঘিয়ে কাগজ রঙ */
            color: #332d2a;
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background-color: #332d2a;
            color: #fcfbf7;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
        }
        nav {
            margin-top: 15px;
        }
        nav a {
            color: #fcfbf7;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        /* একক কলাম লেআউট - কোনো সাইডবার নেই */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .post {
            background: #ffffff;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #e6e3da;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .post h2 {
            color: #8b0000; /* সিন্দুর লাল শিরোনাম */
            margin-top: 0;
        }
        /* সাহিত্য পত্রিকার মতো প্রথম অক্ষর বড় (Drop Cap) */
        .post p:first-of-type::first-letter {
            font-size: 2.5em;
            float: left;
            margin-right: 8px;
            color: #8b0000;
            font-weight: bold;
            line-height: 1;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 0.9em;
            border-top: 1px solid #e6e3da;
        }
    </style>
</head>
<body>

    <header>
        <h1>BODHON</h1>
        <nav>
            <a href="#">প্রচ্ছদ</a>
            <a href="#">বিস্মৃত উপাখ্যান</a>
            <a href="#">জজীবনদর্শন</a>
        </nav>
    </header>

  <div class="container">
        {% for post in site.posts %}
        <div class="post">
            <h2><a href="{{ post.url | relative_url }}" style="color: #8b0000; text-decoration: none;">{{ post.title }}</a></h2>
            {{ post.content }}
        </div>
        {% endfor %}
    </div>

    <footer>
        <p>~ভাস্কর~</p>
        <p>Copyright : Bhaskar Gangopadhyay, 2026</p>
    </footer>

</body>
</html>
